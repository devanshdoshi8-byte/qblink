name: Service Worker Deploy Simulation

on:
  push:
  pull_request:

concurrency:
  group: sw-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sw-cache-tests:
    name: SW cache strategy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deploy-simulation suite
        run: npx vitest run src/test/swDeploySimulation.test.ts --reporter=verbose